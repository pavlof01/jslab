apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-v8
  labels:
    app: engine-v8
spec:
  replicas: 1
  # Single replica on a resource-tight node: recreate (no surge pod) so a
  # rollout never needs 2x capacity. Avoids old pods getting stuck terminating
  # when several engines roll at once. Trade-off: a few seconds of downtime
  # for this engine during its own deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: engine-v8
  template:
    metadata:
      labels:
        app: engine-v8
    spec:
      terminationGracePeriodSeconds: 15
      # No egress allow reaches the cluster API anyway (see the NetworkPolicy),
      # but user code here can read the filesystem (see engine-jsc/server.ts's
      # lockdown comment) — don't hand it a token it has no legitimate use for.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: engine-v8
          image: pavlof01/jslab-engine-v8:latest
          env:
            - name: NODE_ENV
              value: production
            - name: D8_PATH
              value: /usr/local/bin/d8
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: engine-v8
  labels:
    app: engine-v8
spec:
  selector:
    app: engine-v8
  ports:
    - port: 8080
      targetPort: 8080
