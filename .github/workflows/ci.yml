name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lint and import order for every workspace at once. Biome needs
  # no per-service install and finishes in seconds, so it runs first and gives
  # fast feedback on the cheapest class of mistake.
  quality:
    name: biome
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # `biome ci` never writes; it fails on anything `biome check --write`
      # would have changed. --reporter=github puts each finding on its line in
      # the PR diff.
      - name: Check formatting, lint and import order
        run: npm run ci

  apps:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # A healthy matrix leg finishes in well under two minutes; this only has to
    # stop a wedged install or a test that never returns from billing the whole
    # six-hour default. One such run burned 68 minutes on 2026-08-06.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine-runtime,       dir: packages/engine-runtime,   typecheck: "npm run lint",  test: "npm test" }
          - { name: api,                  dir: apps/api,                  typecheck: "npm run lint",  test: "npm test", runtime: true }
          - { name: engine-v8,            dir: apps/engine-v8,            typecheck: "npm run lint",  test: "", runtime: true }
          - { name: engine-hermes,        dir: apps/engine-hermes,        typecheck: "npm run lint",  test: "", runtime: true }
          - { name: engine-jsc,           dir: apps/engine-jsc,           typecheck: "npm run lint",  test: "", runtime: true }
          - { name: engine-spidermonkey,  dir: apps/engine-spidermonkey,  typecheck: "npm run lint",  test: "", runtime: true }
          - { name: trace-service,        dir: apps/trace-service,        typecheck: "npm run typecheck", test: "npm test" }
          - { name: frontend,             dir: apps/frontend/src,         typecheck: "npx --no-install tsc --noEmit -p tsconfig.json && npm run lint", test: "npm test" }
    steps:
      - uses: actions/checkout@v4
        with:
          # trace-service vendors engine262 as a submodule; its tests need it.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      # Engines consume @jslab/engine-runtime as a file: dependency, and npm
      # copies it into node_modules as-is — dist has to exist beforehand.
      - name: Build shared engine runtime
        if: ${{ matrix.runtime }}
        working-directory: packages/engine-runtime
        run: npm ci && npm run build
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.typecheck }}
      - name: Test
        if: ${{ matrix.test != '' }}
        working-directory: ${{ matrix.dir }}
        # CI=true (set by GitHub) makes vitest/jest run once instead of watching.
        run: ${{ matrix.test }}

  manifests:
    name: k8s-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.5.0"
      - name: Install kubeconform
        run: |
          set -euo pipefail
          ver="v0.6.7"
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${ver}/kubeconform-linux-amd64.tar.gz"
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Build + validate overlays
        run: |
          set -euo pipefail
          validate() {
            echo "== $1 =="
            kustomize build ${2:-} "$1" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default
          }
          validate infra/k8s/base
          validate infra/k8s/prod
          validate infra/k8s/dev "--load-restrictor=LoadRestrictionsNone"
          for svc in api trace frontend engine-v8 engine-hermes engine-jsc engine-spidermonkey; do
            validate "infra/k8s/prod/services/${svc}" "--load-restrictor=LoadRestrictionsNone"
          done

  # NOTE: infra/policy/ingress.rego is intentionally not run here. One of its
  # deny rules checks that every ingress TLS secret has a Secret/Certificate in
  # the same namespace, but those are provisioned out-of-band (see infra/README),
  # so it can only pass against a live cluster. Run it in a cluster-aware job.

  # Single required status check for branch protection. Without this, protecting
  # `main` means naming all ten legs by hand and editing the setting every time
  # the matrix gains a service — and a leg that is renamed silently stops being
  # required. Point branch protection at "quality-gate" and nothing else.
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality, apps, manifests]
    # `always()` so this job still runs (and fails) when a dependency fails or
    # is cancelled; without it the job would be skipped, which branch protection
    # reads as success.
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          set -euo pipefail
          results="quality=${{ needs.quality.result }}"
          results="$results apps=${{ needs.apps.result }}"
          results="$results manifests=${{ needs.manifests.result }}"
          echo "$results"
          for entry in $results; do
            case "${entry#*=}" in
              success) ;;
              *) echo "::error::$entry"; failed=1 ;;
            esac
          done
          if [ "${failed:-0}" = "1" ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
