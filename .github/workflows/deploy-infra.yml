name: deploy-infra

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH (known_hosts + key)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          key_path="$HOME/.ssh/id_deploy"
          raw_tmp="$(mktemp)"
          b64_tmp="$(mktemp)"
          trap 'rm -f "${raw_tmp}" "${b64_tmp}"' EXIT

          # Accept both raw multi-line keys and base64-encoded keys.
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > "${raw_tmp}"
          if ssh-keygen -y -f "${raw_tmp}" </dev/null >/dev/null 2>&1; then
            mv "${raw_tmp}" "${key_path}"
          elif printf '%s' "${SSH_KEY}" | base64 --decode 2>/dev/null | tr -d '\r' > "${b64_tmp}" \
            && ssh-keygen -y -f "${b64_tmp}" </dev/null >/dev/null 2>&1; then
            mv "${b64_tmp}" "${key_path}"
          else
            echo "SSH_KEY secret is not a valid private key (raw PEM/OpenSSH or base64-encoded)." >&2
            exit 1
          fi
          chmod 600 "${key_path}"

          hostkeys="$(mktemp)"
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" > "${hostkeys}" 2>/dev/null

          if [ -n "${SSH_FINGERPRINT:-}" ]; then
            if ! ssh-keygen -lf "${hostkeys}" | grep -Fq "${SSH_FINGERPRINT}"; then
              echo "SSH host key fingerprint mismatch for ${SSH_HOST}." >&2
              ssh-keygen -lf "${hostkeys}" >&2 || true
              exit 1
            fi
          fi

          cat "${hostkeys}" >> ~/.ssh/known_hosts
          rm -f "${hostkeys}"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" <<'EOSSH'
          set -euo pipefail

          cd /root/js-engines

          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fd

          kubectl apply -f infra/k8s/base/namespace.yaml

          NAMESPACE="jslab"

          current_image() {
            local deployment="$1"
            kubectl -n "${NAMESPACE}" get deployment "${deployment}" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true
          }

          api_image="$(current_image api)"
          v8_image="$(current_image engine-v8)"
          hermes_image="$(current_image engine-hermes)"
          jsc_image="$(current_image engine-jsc)"
          sm_image="$(current_image engine-spidermonkey)"
          frontend_image="$(current_image frontend)"
          trace_image="$(current_image trace-service)"

          api_image="${api_image:-pavlof01/jslab-api:latest}"
          v8_image="${v8_image:-pavlof01/jslab-engine-v8:latest}"
          hermes_image="${hermes_image:-pavlof01/jslab-engine-hermes:latest}"
          jsc_image="${jsc_image:-pavlof01/jslab-engine-jsc:latest}"
          sm_image="${sm_image:-pavlof01/jslab-engine-spidermonkey:latest}"
          frontend_image="${frontend_image:-pavlof01/jslab-frontend:latest}"
          trace_image="${trace_image:-pavlof01/jslab-trace-service:latest}"

          overlay="infra/k8s/.deploy-infra-overlay"
          rm -rf "${overlay}"
          mkdir -p "${overlay}"
          trap 'rm -rf "${overlay}"' EXIT

          cat > "${overlay}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../prod
          images:
            - name: pavlof01/jslab-api
              newName: ${api_image%:*}
              newTag: ${api_image##*:}
            - name: pavlof01/jslab-engine-v8
              newName: ${v8_image%:*}
              newTag: ${v8_image##*:}
            - name: pavlof01/jslab-engine-hermes
              newName: ${hermes_image%:*}
              newTag: ${hermes_image##*:}
            - name: pavlof01/jslab-engine-jsc
              newName: ${jsc_image%:*}
              newTag: ${jsc_image##*:}
            - name: pavlof01/jslab-engine-spidermonkey
              newName: ${sm_image%:*}
              newTag: ${sm_image##*:}
            - name: pavlof01/jslab-frontend
              newName: ${frontend_image%:*}
              newTag: ${frontend_image##*:}
            - name: pavlof01/jslab-trace-service
              newName: ${trace_image%:*}
              newTag: ${trace_image##*:}
          EOF

          echo "Using images:"
          echo "api=$api_image"
          echo "v8=$v8_image"
          echo "hermes=$hermes_image"
          echo "jsc=$jsc_image"
          echo "spidermonkey=$sm_image"
          echo "frontend=$frontend_image"
          echo "trace-service=$trace_image"

          kubectl kustomize "${overlay}"
          kubectl apply -k "${overlay}"
          EOSSH
