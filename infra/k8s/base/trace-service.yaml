apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-service
  labels:
    app: trace-service
spec:
  replicas: 1
  # Single replica on a resource-tight node: recreate (no surge pod) so a
  # rollout never needs 2x capacity. Avoids the pod getting stuck terminating
  # when several services roll at once. Trade-off: a few seconds of downtime
  # during its own deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trace-service
  template:
    metadata:
      labels:
        app: trace-service
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: trace-service
          image: pavlof01/jslab-trace-service:latest
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "warn"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              # engine262 traces are short and bursty, so reserve for the idle
              # baseline rather than the peak — the node is shared and a 500m
              # reservation here was enough to leave engine-jsc unschedulable.
              # Bursts are still covered by the limits below.
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trace-service
  labels:
    app: trace-service
spec:
  selector:
    app: trace-service
  ports:
    - port: 8080
      targetPort: 8080
