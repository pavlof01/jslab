name: deploy-api

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "packages/engine-runtime/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/reusable-deploy-service-vps.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Roll back: redeploy an image tag that already exists (e.g. an earlier commit SHA) instead of building this ref"
        required: false
        default: ""
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service-vps.yml
    with:
      service: api
      context: .
      dockerfile: apps/api/Dockerfile
      verify_dir: apps/api
      needs_engine_runtime: true
      image: jslab-api
      deployment: api
      container: api
      verify_command: npm run lint && npm test
      image_tag: ${{ github.event.inputs.image_tag || '' }}
      # The gateway's own value is proving the whole path works, not just that it
      # booted: POST /api/run reaches engine-v8 over the real Service network and
      # runs d8, so "42" in the reply means gateway -> engine -> binary all work.
      # /healthz alone (the old check) never left the api pod.
      smoke_path: /api/run
      smoke_body: '{"engine":"v8","sourceText":"print(6*7)"}'
      smoke_expect: "42"
    secrets: inherit
