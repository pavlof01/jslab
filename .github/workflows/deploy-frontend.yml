name: deploy-frontend

on:
  push:
    branches: ["main"]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/reusable-deploy-service-vps.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service-vps.yml
    with:
      service: frontend
      context: apps/frontend
      dockerfile: apps/frontend/Dockerfile
      image: jslab-frontend
      deployment: frontend
      container: frontend
      verify_dir: apps/frontend/src
      verify_command: npx --no-install tsc --noEmit -p tsconfig.json && npm test
    secrets: inherit
