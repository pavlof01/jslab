apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: jslab

build:
  local:
    push: false
    useBuildkit: true
  artifacts:
    - image: jslab-api
      context: .
      docker:
        dockerfile: apps/api/Dockerfile
        target: dev
      sync:
        infer:
          - "apps/api/src/**/*.ts"
          - "apps/api/package.json"
          - "apps/api/package-lock.json"
          - "apps/api/tsconfig*.json"

    - image: jslab-frontend
      context: apps/frontend
      docker:
        dockerfile: Dockerfile
        target: dev
      sync:
        infer:
          - "src/**/*"
          - "Dockerfile"

    - image: jslab-trace-service
      context: apps/trace-service
      docker:
        dockerfile: Dockerfile
        target: dev
      sync:
        infer:
          - "src/**/*"
          - "config.ts"
          - "package.json"
          - "package-lock.json"
          - "tsconfig*.json"

    - image: jslab-engine-v8
      context: .
      docker:
        dockerfile: apps/engine-v8/Dockerfile
        target: dev
      sync:
        infer:
          - "apps/engine-v8/src/**/*.ts"
          - "apps/engine-v8/package.json"
          - "apps/engine-v8/package-lock.json"
          - "apps/engine-v8/tsconfig*.json"

    - image: jslab-engine-hermes
      context: .
      docker:
        dockerfile: apps/engine-hermes/Dockerfile
        target: dev
      sync:
        infer:
          - "apps/engine-hermes/src/**/*.ts"
          - "apps/engine-hermes/package.json"
          - "apps/engine-hermes/package-lock.json"
          - "apps/engine-hermes/tsconfig*.json"

    - image: jslab-engine-jsc
      context: .
      docker:
        dockerfile: apps/engine-jsc/Dockerfile
        target: dev
      sync:
        infer:
          - "apps/engine-jsc/src/**/*.ts"
          - "apps/engine-jsc/package.json"
          - "apps/engine-jsc/package-lock.json"
          - "apps/engine-jsc/tsconfig*.json"

    - image: jslab-engine-spidermonkey
      context: .
      docker:
        dockerfile: apps/engine-spidermonkey/Dockerfile
        target: dev
      sync:
        infer:
          - "apps/engine-spidermonkey/src/**/*.ts"
          - "apps/engine-spidermonkey/package.json"
          - "apps/engine-spidermonkey/package-lock.json"
          - "apps/engine-spidermonkey/tsconfig*.json"

manifests:
  kustomize:
    paths:
      - infra/k8s/dev
    buildArgs:
      - --load-restrictor=LoadRestrictionsNone

deploy:
  kubectl:
    defaultNamespace: jslab

portForward:
  - resourceType: service
    resourceName: frontend
    namespace: jslab
    port: 3000
    localPort: 3000
  - resourceType: service
    resourceName: trace-service
    namespace: jslab
    port: 8080
    localPort: 8085
  - resourceType: service
    resourceName: api
    namespace: jslab
    port: 8080
    localPort: 8080
