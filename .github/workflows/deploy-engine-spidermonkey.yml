name: deploy-engine-spidermonkey

on:
  push:
    branches: ["main"]
    paths:
      - "apps/engine-spidermonkey/**"
      - "packages/engine-runtime/**"
      - ".github/workflows/deploy-engine-spidermonkey.yml"
      - ".github/workflows/reusable-deploy-service-vps.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Roll back: redeploy an image tag that already exists (e.g. an earlier commit SHA) instead of building this ref"
        required: false
        default: ""
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service-vps.yml
    with:
      service: engine-spidermonkey
      context: .
      dockerfile: apps/engine-spidermonkey/Dockerfile
      verify_dir: apps/engine-spidermonkey
      needs_engine_runtime: true
      image: jslab-engine-spidermonkey
      deployment: engine-spidermonkey
      container: engine-spidermonkey
      image_tag: ${{ github.event.inputs.image_tag || '' }}
      # The sm wrapper disassembles instead of running the snippet, so there is
      # no program output to match on, and the disassembly text is shell-version
      # specific. ok:true is the portable assertion: the service answered /run
      # within its timeout and output caps.
      smoke_path: /run
      smoke_body: '{"sourceText":"print(6*7)"}'
      smoke_expect: '"ok":true'
    secrets: inherit
