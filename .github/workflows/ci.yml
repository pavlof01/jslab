name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # Prettier --check never writes; it fails on anything --write would have
      # changed. ESLint here covers every workspace except apps/frontend, which
      # brings eslint-config-next and is linted by its own matrix leg.
      - name: Check formatting and lint
        run: npm run ci

  apps:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # A healthy matrix leg finishes in well under two minutes; this only has to
    # stop a wedged install or a test that never returns from billing the whole
    # six-hour default. One such run burned 68 minutes on 2026-08-06.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: engine-runtime,
              dir: packages/engine-runtime,
              typecheck: "npm run lint",
              test: "npm test",
            }
          - { name: api, dir: apps/api, typecheck: "npm run lint", test: "npm test", runtime: true }
          - {
              name: engine-v8,
              dir: apps/engine-v8,
              typecheck: "npm run lint",
              test: "npm test",
              runtime: true,
            }
          - {
              name: engine-hermes,
              dir: apps/engine-hermes,
              typecheck: "npm run lint",
              test: "npm test",
              runtime: true,
            }
          - {
              name: engine-jsc,
              dir: apps/engine-jsc,
              typecheck: "npm run lint",
              test: "npm test",
              runtime: true,
            }
          - {
              name: engine-spidermonkey,
              dir: apps/engine-spidermonkey,
              typecheck: "npm run lint",
              test: "npm test",
              runtime: true,
            }
          - {
              name: trace-service,
              dir: apps/trace-service,
              typecheck: "npm run typecheck",
              test: "npm test",
            }
          - {
              name: frontend,
              dir: apps/frontend/src,
              typecheck: "npx --no-install tsc --noEmit -p tsconfig.json && npm run lint",
              test: "npm test",
            }
    steps:
      - uses: actions/checkout@v4
        with:
          # trace-service vendors engine262 as a submodule; its tests need it.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      # Engines consume @jslab/engine-runtime as a file: dependency, and npm
      # copies it into node_modules as-is — dist has to exist beforehand.
      - name: Build shared engine runtime
        if: ${{ matrix.runtime }}
        working-directory: packages/engine-runtime
        run: npm ci && npm run build
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.typecheck }}
      - name: Test
        if: ${{ matrix.test != '' }}
        working-directory: ${{ matrix.dir }}
        # CI=true (set by GitHub) makes vitest/jest run once instead of watching.
        run: ${{ matrix.test }}

  submodules:
    name: submodule-gitlinks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # submodules: false on purpose — a gitlink that is not on its remote makes
      # a recursive checkout die with "upload-pack: not our ref", which is the
      # error this job exists to translate into something actionable.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Every submodule gitlink must exist on its own remote
        run: |
          set -euo pipefail
          status=0
          while read -r mode _type sha path; do
            [ "$mode" = "160000" ] || continue
            url="$(git config -f .gitmodules --get "submodule.${path}.url")"
            if git ls-remote "$url" | awk '{print $1}' | grep -qx "$sha"; then
              echo "ok: $path -> $sha"
            else
              echo "::error file=.gitmodules::Submodule '$path' points at $sha, which is not on $url. Push that submodule's branch, then push this repo again (git config push.recurseSubmodules on-demand does it automatically)."
              status=1
            fi
          done < <(git ls-tree -r HEAD)
          exit $status

  api-redis:
    name: api-redis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      # The gateway consumes @jslab/engine-runtime as a file: dependency.
      - name: Build shared engine runtime
        working-directory: packages/engine-runtime
        run: npm ci && npm run build
      - name: Install
        working-directory: apps/api
        run: npm ci
      # Only the Redis-gated suite; the hermetic matrix leg already ran the rest.
      - name: Test against real Redis
        working-directory: apps/api
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: npx vitest run src/app.redis.test.ts

  manifests:
    name: k8s-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.5.0"
      - name: Install kubeconform
        run: |
          set -euo pipefail
          ver="v0.6.7"
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${ver}/kubeconform-linux-amd64.tar.gz"
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Build + validate overlays
        run: |
          set -euo pipefail
          validate() {
            echo "== $1 =="
            kustomize build ${2:-} "$1" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default
          }
          validate infra/k8s/base
          validate infra/k8s/prod
          validate infra/k8s/dev "--load-restrictor=LoadRestrictionsNone"
          for svc in api trace frontend engine-v8 engine-hermes engine-jsc engine-spidermonkey; do
            validate "infra/k8s/prod/services/${svc}" "--load-restrictor=LoadRestrictionsNone"
          done

  # NOTE: infra/policy/ingress.rego is intentionally not run here. One of its
  # deny rules checks that every ingress TLS secret has a Secret/Certificate in
  # the same namespace, but those are provisioned out-of-band (see infra/README),
  # so it can only pass against a live cluster. Run it in a cluster-aware job.
