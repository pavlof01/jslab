name: deploy-infra

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -H 103.106.2.32 >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@103.106.2.32 "echo ok"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@103.106.2.32 <<'EOSSH'
            set -euo pipefail

            cd /root/js-engines

            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd

            kubectl apply -f infra/k8s/base/namespace.yaml

            # Preserve already-deployed immutable tags when applying infra changes.
            # Otherwise, applying `infra/k8s/prod` would reset images back to whatever
            # tag is checked into git (e.g. `latest` placeholders).
            NAMESPACE="jslab"

            current_image() {
              local deployment="$1"
              kubectl -n "${NAMESPACE}" get deployment "${deployment}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true
            }

            api_image="$(current_image api)"
            v8_image="$(current_image engine-v8)"
            hermes_image="$(current_image engine-hermes)"
            jsc_image="$(current_image engine-jsc)"
            sm_image="$(current_image engine-spidermonkey)"
            frontend_image="$(current_image frontend)"

            api_image="${api_image:-pavlof01/jslab-api:latest}"
            v8_image="${v8_image:-pavlof01/jslab-engine-v8:latest}"
            hermes_image="${hermes_image:-pavlof01/jslab-engine-hermes:latest}"
            jsc_image="${jsc_image:-pavlof01/jslab-engine-jsc:latest}"
            sm_image="${sm_image:-pavlof01/jslab-engine-spidermonkey:latest}"
            frontend_image="${frontend_image:-pavlof01/jslab-frontend:latest}"

            overlay="$(mktemp -d)"
            trap 'rm -rf "${overlay}"' EXIT

          cat > "${overlay}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - $(pwd)/infra/k8s/prod
          images:
            - name: pavlof01/jslab-api
              newName: ${api_image%:*}
              newTag: ${api_image##*:}
            - name: pavlof01/jslab-engine-v8
              newName: ${v8_image%:*}
              newTag: ${v8_image##*:}
            - name: pavlof01/jslab-engine-hermes
              newName: ${hermes_image%:*}
              newTag: ${hermes_image##*:}
            - name: pavlof01/jslab-engine-jsc
              newName: ${jsc_image%:*}
              newTag: ${jsc_image##*:}
            - name: pavlof01/jslab-engine-spidermonkey
              newName: ${sm_image%:*}
              newTag: ${sm_image##*:}
            - name: pavlof01/jslab-frontend
              newName: ${frontend_image%:*}
              newTag: ${frontend_image##*:}
          EOF

            kubectl kustomize "${overlay}" --load-restrictor=LoadRestrictionsNone | kubectl apply -f -
          EOSSH
