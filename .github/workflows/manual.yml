name: deploy-all

# Required GitHub secrets:
# - DOCKERHUB_USERNAME / DOCKERHUB_TOKEN: push images to Docker Hub
# - KUBECONFIG_BASE64: base64-encoded kubeconfig with cluster access

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to the commit SHA)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  NAMESPACE: jslab
  IMAGE_REPO: pavlof01
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        svc:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            image: jslab-api
          - name: engine-v8
            context: apps/engine-v8
            dockerfile: apps/engine-v8/Dockerfile
            image: jslab-engine-v8
          - name: engine-hermes
            context: apps/engine-hermes
            dockerfile: apps/engine-hermes/Dockerfile
            image: jslab-engine-hermes
          - name: engine-jsc
            context: apps/engine-jsc
            dockerfile: apps/engine-jsc/Dockerfile
            image: jslab-engine-jsc
          - name: engine-spidermonkey
            context: apps/engine-spidermonkey
            dockerfile: apps/engine-spidermonkey/Dockerfile
            image: jslab-engine-spidermonkey
          - name: frontend
            context: apps/frontend
            dockerfile: apps/frontend/Dockerfile
            image: jslab-frontend
          - name: trace-service
            context: apps/trace-service
            dockerfile: apps/trace-service/Dockerfile
            image: jslab-trace-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.svc.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.svc.image }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}/${{ matrix.svc.image }}:latest
          cache-from: type=gha,scope=${{ matrix.svc.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.5.0"

      - name: Configure kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure namespace
        run: kubectl apply -f infra/k8s/base/namespace.yaml

      - name: Deploy manifests (kustomize)
        run: |
          set -euo pipefail

          K8S_DIR="${RUNNER_TEMP}/k8s-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp -R infra/k8s "${K8S_DIR}"
          cd "${K8S_DIR}/prod"

          kustomize edit set image \
            pavlof01/jslab-api=pavlof01/jslab-api:${IMAGE_TAG} \
            pavlof01/jslab-engine-v8=pavlof01/jslab-engine-v8:${IMAGE_TAG} \
            pavlof01/jslab-engine-hermes=pavlof01/jslab-engine-hermes:${IMAGE_TAG} \
            pavlof01/jslab-engine-jsc=pavlof01/jslab-engine-jsc:${IMAGE_TAG} \
            pavlof01/jslab-engine-spidermonkey=pavlof01/jslab-engine-spidermonkey:${IMAGE_TAG} \
            pavlof01/jslab-frontend=pavlof01/jslab-frontend:${IMAGE_TAG} \
            pavlof01/jslab-trace-service=pavlof01/jslab-trace-service:${IMAGE_TAG}

          kustomize build . --load-restrictor LoadRestrictionsNone | kubectl apply -f -

      - name: Wait for rollouts
        run: |
          set -euo pipefail

          kubectl -n "${NAMESPACE}" rollout status deployment/api --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/frontend --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/engine-v8 --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/engine-hermes --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/engine-jsc --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/engine-spidermonkey --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/redis --timeout=10m
          kubectl -n "${NAMESPACE}" rollout status deployment/trace-service --timeout=10m
