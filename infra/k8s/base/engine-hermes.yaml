apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-hermes
  labels:
    app: engine-hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-hermes
  template:
    metadata:
      labels:
        app: engine-hermes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: engine-hermes
          image: jslab-engine-hermes:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: ENGINE_SHARED_SECRET
            - name: HERMES_PATH
              value: /usr/local/bin/hermes
            - name: HERMESC_PATH
              value: /usr/local/bin/hermesc
            - name: HBCDUMP_PATH
              value: /usr/local/bin/hbcdump
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: engine-hermes
  labels:
    app: engine-hermes
spec:
  selector:
    app: engine-hermes
  ports:
    - port: 8080
      targetPort: 8080
