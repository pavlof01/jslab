# ─── jslab-api ────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jslab-api
  namespace: jslab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "1000"
    traefik.ingress.kubernetes.io/router.middlewares: jslab-jslab-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jslab.su
        - www.jslab.su
        - jslab.cc
        - www.jslab.cc
      secretName: cloudflare-origin-tls
  rules:
    - host: jslab.su
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
    - host: www.jslab.su
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
    - host: jslab.cc
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
    - host: www.jslab.cc
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
