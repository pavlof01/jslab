# jslab-traefik-cloudflare.yaml
#
# Production-ready setup (Cloudflare in front, Traefik at origin):
# - HTTPS redirect handled by Cloudflare (no redirect middleware here)
# - HSTS handled by Cloudflare (do NOT set Strict-Transport-Security here unless you fully control it)
# - Traefik does routing + basic security headers
# - Two ingresses with explicit priorities so `/api` is never shadowed by `/`

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jslab-security-headers
  namespace: jslab
spec:
  headers:
    customResponseHeaders:
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"
      Referrer-Policy: "no-referrer"
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jslab-api
  namespace: jslab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "1000"
    traefik.ingress.kubernetes.io/router.middlewares: jslab-jslab-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jslab.su
        - www.jslab.su
      secretName: cloudflare-origin-tls
  rules:
    - host: jslab.su
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
    - host: www.jslab.su
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jslab-frontend
  namespace: jslab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "10"
    traefik.ingress.kubernetes.io/router.middlewares: jslab-jslab-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jslab.su
        - www.jslab.su
      secretName: cloudflare-origin-tls
  rules:
    - host: jslab.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: www.jslab.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
