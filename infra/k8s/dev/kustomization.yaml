apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jslab
resources:
  # Dev overlay intentionally excludes Traefik CRDs (Ingress/Middleware),
  # since local clusters may not have them installed. Use port-forward instead.
  - ../base/namespace.yaml
  - ../base/api-configmap.yaml
  - ../base/api-secret.example.yaml
  - ../base/redis.yaml
  - ../base/api-deployment.yaml
  - ../base/engine-v8.yaml
  - ../base/engine-hermes.yaml
  - ../base/engine-jsc.yaml
  - ../base/engine-spidermonkey.yaml
  - ../base/frontend.yaml
  - ../base/pdb.yaml
images:
  # Make base manifests use local Skaffold artifact image names.
  - name: pavlof01/jslab-api
    newName: jslab-api
  - name: pavlof01/jslab-engine-v8
    newName: jslab-engine-v8
  - name: pavlof01/jslab-engine-hermes
    newName: jslab-engine-hermes
  - name: pavlof01/jslab-engine-jsc
    newName: jslab-engine-jsc
  - name: pavlof01/jslab-engine-spidermonkey
    newName: jslab-engine-spidermonkey
  - name: pavlof01/jslab-frontend
    newName: jslab-frontend
patches:
  - path: frontend-dev.yaml
  - path: api-dev.yaml
  - path: engine-v8-dev.yaml
  - path: engine-hermes-dev.yaml
  - path: engine-jsc-dev.yaml
  - path: engine-spidermonkey-dev.yaml
  # Disable probes in dev to avoid noisy /healthz logs during Skaffold hot-reload.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: engine-v8
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: engine-hermes
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: engine-jsc
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: engine-spidermonkey
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
