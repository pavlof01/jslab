name: deploy-api

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/reusable-deploy-service-vps.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service-vps.yml
    with:
      service: api
      context: apps/api
      dockerfile: apps/api/Dockerfile
      image: jslab-api
      deployment: api
      container: api
      verify_command: npm run lint && npm test
    secrets: inherit
