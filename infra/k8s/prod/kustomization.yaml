apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jslab

resources:
  - ../base

patches:
  # Secrets are managed out-of-band (GitHub Actions / SealedSecrets / etc).
  # The base includes an example Secret for local/dev convenience; delete it in prod.
  - path: delete-api-secret.yaml

images:
  # Tags are set by CI (e.g. to the commit SHA) before applying.
  - name: pavlof01/jslab-api
    newTag: "__IMAGE_TAG__"
  - name: pavlof01/jslab-engine-v8
    newTag: "__IMAGE_TAG__"
  - name: pavlof01/jslab-engine-hermes
    newTag: "__IMAGE_TAG__"
  - name: pavlof01/jslab-frontend
    newTag: "__IMAGE_TAG__"

