name: deploy-engine-v8

on:
  push:
    branches: ["main"]
    paths:
      - "apps/engine-v8/**"
      - "packages/engine-runtime/**"
      - ".github/workflows/deploy-engine-v8.yml"
      - ".github/workflows/reusable-deploy-service-vps.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service-vps.yml
    with:
      service: engine-v8
      context: .
      dockerfile: apps/engine-v8/Dockerfile
      verify_dir: apps/engine-v8
      needs_engine_runtime: true
      image: jslab-engine-v8
      deployment: engine-v8
      container: engine-v8
    secrets: inherit
