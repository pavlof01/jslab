apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app: api
data:
  ENGINE_V8_URL: http://engine-v8:8080
  ENGINE_HERMES_URL: http://engine-hermes:8080
  ENGINE_SM_URL: http://engine-spidermonkey:8080
  ENGINE_JSC_URL: http://engine-jsc:8080
  TRACE_SERVICE_URL: http://trace-service:8080
  REDIS_URL: redis://redis:6379
  CACHE_TTL_SECONDS: "600"
  RATE_LIMIT_PER_MIN: "60"
  RATE_LIMIT_HEAVY_PER_MIN: "20"
  API_KEY_RATE_LIMIT_PER_MIN: "240"
  API_KEY_ISSUE_PER_HOUR: "5"
  MAX_TIMEOUT_MS: "5000"
  MIN_TIMEOUT_MS: "250"
  DEFAULT_TIMEOUT_MS: "2000"
  LOG_LEVEL: info
