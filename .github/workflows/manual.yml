name: Deploy jslab.cc (Next.js via systemd)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 1) Все run-команды по умолчанию в подпапке
defaults:
  run:
    working-directory: js-bytecode-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ secrets.NODE_VERSION || '20' }}
          cache: npm
          # 2) Явно указываем путь к lock-файлу
          cache-dependency-path: js-bytecode-web/package-lock.json

      - name: Install deps (CI check only)
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH (pull/build/restart on server)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            echo "[1/5] Pull repo"
            git fetch origin main
            git reset --hard origin/main
            echo "[2/5] Install deps"
            npm ci
            echo "[3/5] Build"
            npm run build
            echo "[4/5] Restart service"
            sudo systemctl restart "${{ secrets.SERVICE_NAME }}"
            sudo systemctl --no-pager --full status "${{ secrets.SERVICE_NAME }}" || true
