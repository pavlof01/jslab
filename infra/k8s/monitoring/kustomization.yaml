apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jslab

# Standalone on purpose: no other kustomization references this directory, so
# neither deploy-infra.yml nor the per-service workflows can apply it by
# accident. Enable by hand once the alloy-grafana-cloud Secret exists.
resources:
  - alloy.yaml

# Generated, not a plain manifest: kustomize appends a content hash to the name
# and rewrites the Deployment's volume reference, so editing config.alloy rolls
# the pod by itself. A hand-written ConfigMap plus a hand-maintained
# checksum/config annotation silently leaves a stale config running.
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
    options:
      labels:
        app: alloy
