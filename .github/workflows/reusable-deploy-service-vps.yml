name: Reusable - Deploy service to VPS (SSH)

# Required secrets (GitHub Actions):
# - DOCKERHUB_USERNAME / DOCKERHUB_TOKEN: push images to Docker Hub
# - SSH_HOST / SSH_USER / SSH_KEY: SSH access to the VPS (SSH_KEY is a private key; raw multi-line is recommended)
# - (optional) SSH_PORT: SSH port (defaults to 22)
# - (optional) SSH_FINGERPRINT: host key fingerprint (recommended)
#
# VPS requirements:
# - kubectl installed and configured (e.g. k3s on the same VPS, or kubeconfig in ~/.kube/config)

on:
  workflow_call:
    inputs:
      service:
        description: "Service key (used for cache scope / concurrency)"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string
      image:
        description: "Docker image name (without repo)"
        required: true
        type: string
      deployment:
        description: "Kubernetes Deployment name"
        required: true
        type: string
      container:
        description: "Kubernetes container name inside the Deployment"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: jslab
        type: string
      image_repo:
        description: "Docker image repository (e.g. DockerHub org)"
        required: false
        default: pavlof01
        type: string
      image_tag:
        description: "Optional image tag override (defaults to commit SHA)"
        required: false
        default: ""
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      SSH_PORT:
        required: false
      SSH_FINGERPRINT:
        required: false

permissions:
  contents: read

env:
  NAMESPACE: ${{ inputs.namespace }}
  IMAGE_REPO: ${{ inputs.image_repo }}
  IMAGE_NAME: ${{ inputs.image }}
  IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
  DEPLOYMENT_NAME: ${{ inputs.deployment }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ inputs.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.5.0"

      - name: Render manifests (kustomize)
        id: render
        run: |
          set -euo pipefail

          K8S_DIR="${RUNNER_TEMP}/k8s-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.service }}"
          MANIFEST="${RUNNER_TEMP}/manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.service }}.yaml"

          cp -R infra/k8s "${K8S_DIR}"
          cd "${K8S_DIR}/prod/services/${{ inputs.service }}"

          kustomize edit set image \
            "pavlof01/${IMAGE_NAME}=${IMAGE_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"

          kustomize build . --load-restrictor LoadRestrictionsNone > "${MANIFEST}"
          echo "manifest=${MANIFEST}" >> "${GITHUB_OUTPUT}"

      - name: Setup SSH (known_hosts + key)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s' "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          hostkeys="$(mktemp)"
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" > "${hostkeys}" 2>/dev/null

          if [ -n "${SSH_FINGERPRINT:-}" ]; then
            if ! ssh-keygen -lf "${hostkeys}" | grep -Fq "${SSH_FINGERPRINT}"; then
              echo "SSH host key fingerprint mismatch for ${SSH_HOST}." >&2
              echo "Expected: ${SSH_FINGERPRINT}" >&2
              echo "Got:" >&2
              ssh-keygen -lf "${hostkeys}" >&2 || true
              exit 1
            fi
          fi

          cat "${hostkeys}" >> ~/.ssh/known_hosts
          rm -f "${hostkeys}"

      - name: Deploy over SSH (kubectl apply)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "kubectl apply -f - && kubectl -n \"${NAMESPACE}\" rollout status \"deployment/${DEPLOYMENT_NAME}\" --timeout=10m" \
            < "${{ steps.render.outputs.manifest }}"
