services:
  engine-v8:
    build:
      target: runner
    environment:
      NODE_ENV: production
    volumes: !reset []

  engine-hermes:
    build:
      target: runner
    environment:
      NODE_ENV: production
    volumes: !reset []

  engine-spidermonkey:
    build:
      target: runner
    environment:
      NODE_ENV: production
    volumes: !reset []

  engine-jsc:
    build:
      target: runner
    environment:
      NODE_ENV: production
    volumes: !reset []

  trace-service:
    build:
      target: prod
    environment:
      NODE_ENV: production
    volumes: !reset []

  api:
    build:
      target: runner
    environment:
      NODE_ENV: production
      RATE_LIMIT_PER_MIN: 100000
      RATE_LIMIT_HEAVY_PER_MIN: 100000
      TRACE_RATE_LIMIT_PER_MIN: 100000
    volumes: !reset []

  frontend:
    build:
      target: runner
    environment:
      NODE_ENV: production
    volumes: !reset []
