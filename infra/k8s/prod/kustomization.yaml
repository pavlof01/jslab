apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jslab

resources:
  - ../base

patches:
  # Secrets are managed out-of-band (GitHub Actions / SealedSecrets / etc).
  # The base includes an example Secret for local/dev convenience; delete it in prod.
  - path: delete-api-secret.yaml

images:
  # CI overrides these tags for each deploy (e.g. to the commit SHA).
  - name: pavlof01/jslab-api
    newTag: latest
  - name: pavlof01/jslab-engine-v8
    newTag: latest
  - name: pavlof01/jslab-engine-hermes
    newTag: latest
  - name: pavlof01/jslab-engine-jsc
    newTag: latest
  - name: pavlof01/jslab-engine-spidermonkey
    newTag: latest
  - name: pavlof01/jslab-frontend
    newTag: latest
