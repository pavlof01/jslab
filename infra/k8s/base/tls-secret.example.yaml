apiVersion: v1
kind: Secret
metadata:
  # This secret must contain a TLS certificate for `jslab.su`/`www.jslab.su` presented by Traefik at the origin.
  #
  # If you use Cloudflare "Full (strict)" with a Cloudflare Origin Certificate:
  # - The cert is NOT publicly trusted by browsers (only Cloudflare will trust it).
  # - Never expose your origin directly to the public Internet; allow only Cloudflare IPs to reach 443.
  #
  # Recommended creation (out-of-band, not committed):
  #   kubectl -n jslab create secret tls cloudflare-origin-tls --cert=origin.crt --key=origin.key
  name: cloudflare-origin-tls
type: kubernetes.io/tls
stringData:
  tls.crt: "replace-me"
  tls.key: "replace-me"
