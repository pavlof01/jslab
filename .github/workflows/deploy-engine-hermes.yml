name: deploy-engine-hermes

on:
  push:
    branches: ["main"]
    paths:
      - "apps/engine-hermes/**"
      - "packages/engine-runtime/**"
      - ".github/workflows/deploy-engine-hermes.yml"
      - ".github/workflows/reusable-deploy-service-vps.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service-vps.yml
    with:
      service: engine-hermes
      context: .
      dockerfile: apps/engine-hermes/Dockerfile
      verify_dir: apps/engine-hermes
      needs_engine_runtime: true
      image: jslab-engine-hermes
      deployment: engine-hermes
      container: engine-hermes
    secrets: inherit
